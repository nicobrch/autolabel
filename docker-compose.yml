services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - server
    networks:
      - autolabel-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - autolabel-db:/app/data
      - autolabel-public:/app/src/public
    networks:
      - autolabel-network

networks:
  autolabel-network:
    driver: bridge

volumes:
  autolabel-db:
  autolabel-public:
