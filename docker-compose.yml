version: '3'

services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - autolabel-network
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    volumes:
      - ./client/nginx.conf:/etc/nginx/conf.d/default.conf

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./server/data:/app/data
      - ./server/checkpoints:/app/checkpoints
    networks:
      - autolabel-network
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ALLOW_ORIGINS=http://localhost,http://localhost:80

networks:
  autolabel-network:
    driver: bridge
